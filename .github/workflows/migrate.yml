name: Migrate Database

on:
  push:
    branches: [main, preview]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment: main=production, preview=staging'
        required: true
        default: 'main'
        type: choice
        options:
          - preview
          - main

concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply SQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MIGRATIONS_DIR: supabase/migrations

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Determine target database
        id: target
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = "preview" ] || [ "${{ inputs.target }}" = "preview" ]; then
            DB_URL="${{ secrets.SUPABASE_PREVIEW_DB_URL }}"
            echo "label=preview" >> "$GITHUB_OUTPUT"
          else
            DB_URL="${{ secrets.SUPABASE_DB_URL }}"
            echo "label=production" >> "$GITHUB_OUTPUT"
          fi
          echo "db_url=$DB_URL" >> "$GITHUB_OUTPUT"
          # GitHub Actions runners may not have IPv6 routes; resolve to IPv4
          HOST=$(printf '%s' "$DB_URL" | sed -E 's#.*@([^:/]+):.*#\1#')
          IPV4=""
          if [ -n "$HOST" ]; then
            IPV4=$(getent ahostsv4 "$HOST" | awk '{ print $1; exit }' 2>/dev/null || true)
          fi
          echo "db_host=$HOST" >> "$GITHUB_OUTPUT"
          echo "db_ipv4=$IPV4" >> "$GITHUB_OUTPUT"

      - name: Run migrations
        shell: bash
        env:
          DATABASE_URL: ${{ steps.target.outputs.db_url }}
          DB_HOST: ${{ steps.target.outputs.db_host }}
          DB_IPV4: ${{ steps.target.outputs.db_ipv4 }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not configured for ${{ steps.target.outputs.label }}"
            exit 1
          fi

          DB="$DATABASE_URL"
          # GitHub Actions runners frequently lack IPv6 routes to some Supabase hosts
          if [ -n "$DB_HOST" ] && [ -n "$DB_IPV4" ]; then
            DB=$(printf '%s' "$DB" | sed "s#@$DB_HOST:#@$DB_IPV4:#")
            echo "Using IPv4 host $DB_IPV4 for ${{ steps.target.outputs.label }}"
          else
            echo "Could not resolve IPv4 for $DB_HOST; using hostname as-is"
          fi
          case "$DB" in
            *sslmode=*) ;;
            *"?") DB="$DB&sslmode=require" ;;
            *) DB="$DB?sslmode=require" ;;
          esac

          for f in "$MIGRATIONS_DIR"/*.sql; do
            echo "Applying $(basename "$f") ..."
            if ! psql -v ON_ERROR_STOP=1 --echo-errors "$DB" -f "$f"; then
              echo "::error::Migration failed for ${{ steps.target.outputs.label }} in file: $(basename "$f")"
              exit 1
            fi
          done
          echo "All migrations applied successfully."

      - name: Seed demo data
        if: steps.target.outputs.label == 'preview' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DATABASE_URL: ${{ steps.target.outputs.db_url }}
          DB_HOST: ${{ steps.target.outputs.db_host }}
          DB_IPV4: ${{ steps.target.outputs.db_ipv4 }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            DB="$DATABASE_URL"
            if [ -n "$DB_HOST" ] && [ -n "$DB_IPV4" ]; then
              DB=$(printf '%s' "$DB" | sed "s#@$DB_HOST:#@$DB_IPV4:#")
            fi
            case "$DB" in
              *sslmode=*) ;;
              *"?") DB="$DB&sslmode=require" ;;
              *) DB="$DB?sslmode=require" ;;
            esac
            echo "Seeding database ..."
            if ! psql -v ON_ERROR_STOP=1 --echo-errors "$DB" -f supabase/seed.sql; then
              echo "::error::Seed failed for ${{ steps.target.outputs.label }}"
              exit 1
            fi
          fi